<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<!-- CSP: Supabase hosts are allowed for API calls and for photos (this app's bucket and a linked contractor's photo URLs) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; form-action 'none'; base-uri 'none'">
<title>Sub Portal</title>
<style>
:root{--navy:#14213d;--ink:#1b2333;--mut:#667085;--line:#e3e7ee;--bg:#f3f5f9;--card:#fff;--acc:#f59e0b;--ok:#15803d;--bad:#b42318;--info:#1d4ed8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;opacity:.75}
header button{background:none;border:0;color:#fff;font-size:15px;padding:6px 8px;cursor:pointer}
main{flex:1;padding:14px 14px 96px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{display:flex;width:100%;max-width:720px}
nav button{flex:1;min-width:0;background:none;border:0;padding:10px 2px 9px;font-size:11px;color:var(--mut);cursor:pointer;border-top:3px solid transparent}
nav button b{display:block;font-size:19px;font-weight:400;line-height:1.2}
nav button.on{color:var(--navy);border-top-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
button.card{display:block;width:100%;text-align:left;cursor:pointer}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.title{font-weight:650;font-size:16px}
.mut{color:var(--mut);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;white-space:nowrap}
.s-sent{background:#fef3c7;color:#92400e}.s-accepted{background:#dbeafe;color:#1e40af}.s-complete{background:#dcfce7;color:#166534}
.s-declined,.s-cancelled,.s-rejected{background:#fee4e2;color:#912018}.s-submitted{background:#fef3c7;color:#92400e}.s-approved{background:#dbeafe;color:#1e40af}.s-paid{background:#dcfce7;color:#166534}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 2px 8px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid #cbd2dc;border-radius:10px;padding:12px;background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--info);outline-offset:1px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-weight:650;font-size:16px;cursor:pointer;background:var(--navy);color:#fff;margin-top:12px}
.btn.ok{background:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border:1px solid var(--bad)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid #cbd2dc}
.btn[disabled]{opacity:.55;cursor:default}
.two{display:flex;gap:10px}.two .btn{flex:1}
.link{background:none;border:0;color:var(--info);text-decoration:underline;cursor:pointer;padding:8px 0;font-size:15px}
.msg{border-radius:10px;padding:11px 13px;margin-bottom:12px;font-size:15px}
.msg.err{background:#fee4e2;color:#7a271a}.msg.good{background:#dcfce7;color:#14532d}.msg.note{background:#e0e7ff;color:#1e3a8a}
.demo{background:var(--acc);color:#3b2500;font-size:13px;font-weight:650;text-align:center;padding:5px 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}

.pay{font-size:22px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stats .card{margin:0;padding:11px;text-align:center}.stats b{display:block;font-size:17px}
.auth{max-width:420px;margin:6vh auto 0;width:100%}
.auth h1{font-size:26px;margin:0 0 4px;color:var(--navy)}
.pre{white-space:pre-wrap}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Subcontractor app — standalone product, single file, no build step.
   Backend: its OWN Supabase project (schema: sub-app-standalone-MIGRATION.sql).
   Talks to Supabase with plain fetch (no SDK).

   A sub can use it alone (enter contractors and work orders by hand) or
   link a contractor: the sub creates a link code, the contractor enters it
   in their system (e.g. Better View Pro), and work orders arrive on their own.

   CONFIG — paste the URL and anon key of the sub app's Supabase project.
   While either is blank the app runs in DEMO MODE on fake in-memory data.
   Add ?demo=1 to the URL to force demo mode after going live.
   ===================================================================== */
const APP_NAME = 'Sub Portal';           // working title — product name not chosen yet
const SB_URL   = '';                      // e.g. https://<project-ref>.supabase.co
const SB_KEY   = '';                      // anon (public) key
const PHOTO_BUCKET = 'wo-photos';
const MGMT_ROLES = ['owner', 'manager', 'project_manager'];
const BILLING_ROLES = ['owner', 'manager'];
const SESSION_KEY = 'subapp_session_v1';
const PENDING_KEY = 'subapp_pending_company_v1';
const CONTRACTOR_COLS = 'id,company_id,name,contact_name,phone,email,notes,link_status,link_code,link_code_expires,linked_name,linked_at';
const DEMO = !SB_URL || !SB_KEY || /[?&]demo=1\b/.test(location.search);

const S = { view: 'loading', authMode: 'signin', tab: 'orders', filter: 'open', detailId: null, edit: null,
  session: null, profile: null, company: null, orders: [], pays: [], contractors: [],
  msg: null, busy: false, form: null };

/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cents = v => { const n = Math.round(Number(v) * 100); return Number.isFinite(n) ? n : 0; };
const money = c => (c / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
function parseMoney(str, allowZero) {   // deterministic: digits, optional 1-2 decimals
  const t = String(str || '').replace(/[$,\s]/g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return null;
  const [d, f = ''] = t.split('.');
  const c = parseInt(d, 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
  return c > 0 || allowZero ? c : null;
}
function fmtDate(d) {
  if (!d) return 'No date set';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d); if (!m) return String(d);
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
// line items are typed one per line: "24 sq Tear-off" or just "Haul away debris"
function parseItems(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = /^(\d+(?:\.\d+)?)\s+(\S+)\s+(.+)$/.exec(l);
    return m ? { desc: m[3], qty: Number(m[1]), unit: m[2] } : { desc: l, qty: null, unit: '' };
  });
}
const itemsText = arr => (Array.isArray(arr) ? arr : []).map(i => (i.qty != null && i.qty !== '' ? i.qty + ' ' + (i.unit || 'ea') + ' ' : '') + (i.desc || '')).join('\n');
const ORDER_LABEL = { sent: 'Needs response', accepted: 'Scheduled', declined: 'Declined', complete: 'Complete', cancelled: 'Cancelled' };
const PAY_LABEL = { submitted: 'Awaiting approval', approved: 'Approved', paid: 'Paid', rejected: 'Rejected' };
const LINK_LABEL = { manual: 'Not linked', pending: 'Code waiting', active: 'Linked', revoked: 'Unlinked' };
const ERR = {
  not_authenticated: 'Your session expired. Sign in again.',
  not_allowed: 'Your role does not allow this. Ask the company owner.',
  already_has_company: 'This login already belongs to a company.',
  company_name_required: 'Enter your company name.',
  name_required: 'Enter the contractor name.',
  title_required: 'Enter a title for the work order.',
  amount_invalid: 'Enter a pay amount like 1250 or 1250.00.',
  contractor_not_found: 'That contractor was not found.',
  not_found: 'That record was not found.',
  not_found_or_locked: 'This work order can no longer be changed.',
  already_linked: 'This contractor is already linked. Unlink first to make a new code.',
  not_found_or_already_answered: 'This work order was already answered or is no longer available.',
  photo_required: 'Add at least one completion photo.',
  not_found_or_not_accepted: 'This work order must be accepted before it can be completed.',
  amount_required: 'Enter an amount greater than zero.',
  work_order_not_complete: 'Mark the work order complete before billing.',
  already_submitted: 'A pay request was already submitted for this work order.',
  not_found_or_linked: 'Payment status on a linked work order is set by the contractor.',
  '42501': 'Permission denied. Sign out and back in, then try again.'
};
const errText = e => ERR[e && e.code] || (e && e.message) || 'Something went wrong. Try again.';
function appErr(code, message) { const e = new Error(message || code); e.code = code; return e; }

/* ---------- Supabase REST (no SDK) ---------- */
function saveSession(s) { S.session = s; try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch (_) {} }
function loadSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (_) { return null; } }
function toSession(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: j.user.id, email: j.user.email } }; }
async function authCall(path, body) {
  const r = await fetch(SB_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw appErr('auth', j.error_description || j.msg || j.message || 'Sign-in failed.');
  return j;
}
async function refreshSession() {
  if (!S.session || !S.session.refresh_token) throw appErr('not_authenticated');
  try { saveSession(toSession(await authCall('token?grant_type=refresh_token', { refresh_token: S.session.refresh_token }))); }
  catch (_) { saveSession(null); throw appErr('not_authenticated'); }
}
const sb = {
  async req(path, opt = {}, retried) {
    if (S.session && S.session.expires_at - 60 < Date.now() / 1000 && !retried) await refreshSession();
    const headers = Object.assign({ apikey: SB_KEY, Authorization: 'Bearer ' + (S.session ? S.session.access_token : SB_KEY) }, opt.headers || {});
    let body = opt.body;
    if (body !== undefined && !(body instanceof Blob)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
    const r = await fetch(SB_URL + path, { method: opt.method || 'GET', headers, body });
    if (r.status === 401 && !retried) { await refreshSession(); return sb.req(path, opt, true); }
    const text = await r.text(); let j = null; try { j = text ? JSON.parse(text) : null; } catch (_) {}
    if (!r.ok) throw appErr((j && j.code) || 'http_' + r.status, (j && (j.message || j.error)) || ('Request failed (' + r.status + ').'));
    return j;
  },
  async rpc(name, args) {
    const j = await sb.req('/rest/v1/rpc/' + name, { method: 'POST', body: args });
    if (j && j.error) throw appErr(j.error);
    return j;
  }
};
// a photo is {url} (sent by a linked contractor) or {path} (uploaded here)
function photoUrl(p) {
  const v = p.url || p.path || '';
  return /^(https:|data:|blob:)/.test(v) ? v : SB_URL + '/storage/v1/object/public/' + PHOTO_BUCKET + '/' + v.split('/').map(encodeURIComponent).join('/');
}

/* ---------- data layer (live) ---------- */
const live = {
  async signIn(email, password) { saveSession(toSession(await authCall('token?grant_type=password', { email, password }))); },
  async signUp(email, password) {
    const j = await authCall('signup', { email, password });
    if (j.access_token) { saveSession(toSession(j)); return true; }
    return false;                       // email confirmation is on: user must confirm, then sign in
  },
  async loadProfile() {
    const rows = await sb.req('/rest/v1/profiles?select=*&id=eq.' + encodeURIComponent(S.session.user.id));
    S.profile = rows && rows[0] || null; S.company = null;
    if (S.profile) { const c = await sb.req('/rest/v1/companies?select=*&id=eq.' + encodeURIComponent(S.profile.company_id)); S.company = c && c[0] || null; }
  },
  async loadData() {                    // RLS scopes every row to this company
    const [o, p, c] = await Promise.all([
      sb.req('/rest/v1/work_orders?select=*'),
      sb.req('/rest/v1/pay_requests?select=*'),
      sb.req('/rest/v1/contractors?select=' + CONTRACTOR_COLS + '&order=name')
    ]);
    S.orders = o || []; S.pays = p || []; S.contractors = c || [];
  },
  createCompany: (name, display) => sb.rpc('signup_create_company', { p_company_name: name, p_display_name: display }),
  saveContractor: (id, f) => sb.rpc('contractor_save', { p_id: id || null, p_name: f.name, p_contact_name: f.contact_name, p_phone: f.phone, p_email: f.email, p_notes: f.notes }),
  createLinkCode: id => sb.rpc('contractor_create_link_code', { p_id: id }),
  revokeLink: id => sb.rpc('contractor_revoke_link', { p_id: id }),
  saveOrder: (id, f) => sb.rpc('wo_save_manual', { p_id: id || null, p_contractor_id: f.contractor_id || null, p_title: f.title, p_address: f.address, p_scope: f.scope, p_line_items: f.line_items, p_pay_amount: f.payCents / 100, p_scheduled_date: f.scheduled_date || null }),
  cancelOrder: id => sb.rpc('wo_cancel_manual', { p_id: id }),
  respond: (id, accept, reason) => sb.rpc('wo_respond', { p_id: id, p_accept: accept, p_reason: reason || null }),
  async complete(id, files, notes) {
    const photos = [];
    for (const f of files) {
      const blob = await toJpeg(f);
      const path = S.profile.company_id + '/' + id + '/' + uuid() + '.jpg';
      await sb.req('/storage/v1/object/' + PHOTO_BUCKET + '/' + path, { method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' } });
      photos.push({ path, caption: '' });
    }
    return sb.rpc('wo_complete', { p_id: id, p_photos: photos, p_notes: notes || null });
  },
  submitPay: (id, amountCents, notes) => sb.rpc('pay_submit', { p_work_order_id: id, p_amount: amountCents / 100, p_notes: notes || null }),
  markPay: (id, status) => sb.rpc('pay_mark_manual', { p_work_order_id: id, p_status: status }),
  signOut() { saveSession(null); }
};
function toJpeg(file) {                  // downscale to max 1600px, JPEG
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(appErr('photo', 'Could not read that photo.')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(appErr('photo', 'Could not read that photo.')); };
    img.src = url;
  });
}

/* ---------- data layer (demo: fake data, same rules and error codes as the server functions) ---------- */
const swatch = (label, color) => 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="' + color + '"/><text x="150" y="158" font-family="sans-serif" font-size="22" fill="#fff" text-anchor="middle">' + label + '</text></svg>');
const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const demoDb = {
  contractors: [
    { id: 'c-1', name: 'Demo General Contracting', contact_name: 'Sample Contact', phone: '', email: '', notes: '', link_status: 'active', linked_name: 'Demo General Contracting' },
    { id: 'c-2', name: 'Example Builders', contact_name: '', phone: '', email: '', notes: 'Pays net 15.', link_status: 'manual' }
  ],
  orders: [
    { id: 'wo-1', contractor_id: 'c-1', source: 'link', title: 'Tear-off and re-roof, 24 sq', address: '123 Sample St, Anytown, WI', scope: 'Full tear-off to deck. Install ice and water at eaves and valleys, synthetic underlayment, architectural shingles, new pipe boots and ridge vent. Haul away debris.', line_items: [{ desc: 'Tear-off, 1 layer', qty: 24, unit: 'sq' }, { desc: 'Architectural shingles', qty: 24, unit: 'sq' }, { desc: 'Ridge vent', qty: 42, unit: 'lf' }], photos: [{ url: swatch('Front elevation', '#64748b'), caption: 'Front' }, { url: swatch('Rear slope', '#475569'), caption: 'Rear' }], pay_amount: 6480, scheduled_date: day(3), status: 'sent' },
    { id: 'wo-2', contractor_id: 'c-2', source: 'manual', title: 'Gutter install, 5" K-style', address: '456 Example Ave, Anytown, WI', scope: 'Remove existing gutters. Install 5" seamless aluminum with 2x3 downspouts, 4 drops.', line_items: [{ desc: '5" seamless gutter', qty: 148, unit: 'lf' }, { desc: '2x3 downspout', qty: 4, unit: 'ea' }], photos: [], pay_amount: 1110, scheduled_date: day(6), status: 'accepted' },
    { id: 'wo-3', contractor_id: 'c-1', source: 'link', title: 'Siding repair, north wall', address: '789 Placeholder Rd, Anytown, WI', scope: 'Replace 2 sq of damaged vinyl siding, match existing profile. Re-flash window head.', line_items: [{ desc: 'Vinyl siding D4', qty: 2, unit: 'sq' }], photos: [], pay_amount: 950, scheduled_date: day(-4), status: 'complete', completion_photos: [{ url: swatch('Completed', '#15803d'), caption: '' }], completion_notes: 'Done. Color match is close.' },
    { id: 'wo-4', contractor_id: 'c-2', source: 'manual', title: 'Soffit and fascia wrap', address: '12 Test Ct, Anytown, WI', scope: 'Wrap fascia in aluminum coil, install vented soffit on front elevation.', line_items: [{ desc: 'Vented soffit', qty: 60, unit: 'lf' }], photos: [], pay_amount: 1375.5, scheduled_date: day(-12), status: 'complete', completion_photos: [{ url: swatch('Completed', '#15803d'), caption: '' }] }
  ],
  pays: [{ id: 'pr-1', work_order_id: 'wo-4', amount: 1375.5, notes: '', status: 'submitted' }],
  user: null
};
const wait = () => new Promise(r => setTimeout(r, 120));
const dOrder = id => demoDb.orders.find(x => x.id === id);
const demo = {
  async signIn() { await wait(); S.session = { user: { id: 'demo', email: 'you@example.com' } }; demoDb.user = demoDb.user || { company: 'Demo Subcontracting LLC', name: 'Demo User' }; },
  async signUp() { await wait(); S.session = { user: { id: 'demo', email: 'you@example.com' } }; demoDb.user = null; return true; },
  async loadProfile() { S.profile = demoDb.user ? { id: 'demo', company_id: 'demo-co', role: 'owner', display_name: demoDb.user.name } : null; S.company = demoDb.user ? { id: 'demo-co', name: demoDb.user.company } : null; },
  async loadData() { await wait(); S.orders = demoDb.orders.map(o => ({ ...o })); S.pays = demoDb.pays.map(p => ({ ...p })); S.contractors = demoDb.contractors.map(c => ({ ...c })).sort((a, b) => a.name.localeCompare(b.name)); },
  async createCompany(name, display) { if (!name) throw appErr('company_name_required'); demoDb.user = { company: name, name: display }; },
  async saveContractor(id, f) { await wait(); if (!f.name) throw appErr('name_required'); const c = demoDb.contractors.find(x => x.id === id); if (c) Object.assign(c, f); else demoDb.contractors.push(Object.assign({ id: uuid(), link_status: 'manual' }, f)); },
  async createLinkCode(id) { await wait(); const c = demoDb.contractors.find(x => x.id === id); if (!c) throw appErr('not_found'); if (c.link_status === 'active') throw appErr('already_linked'); c.link_status = 'pending'; c.link_code = uuid().replace(/-/g, '').slice(0, 10).toUpperCase(); c.link_code_expires = day(7); },
  async revokeLink(id) { await wait(); const c = demoDb.contractors.find(x => x.id === id); if (!c || !['pending', 'active'].includes(c.link_status)) throw appErr('not_found'); c.link_status = 'revoked'; c.link_code = null; },
  async saveOrder(id, f) { await wait(); if (!f.title) throw appErr('title_required'); const row = { contractor_id: f.contractor_id || null, title: f.title, address: f.address, scope: f.scope, line_items: f.line_items, pay_amount: f.payCents / 100, scheduled_date: f.scheduled_date || null }; if (id) { const o = dOrder(id); if (!o || o.source !== 'manual' || o.status !== 'accepted') throw appErr('not_found_or_locked'); Object.assign(o, row); return { id }; } const nid = uuid(); demoDb.orders.push(Object.assign({ id: nid, source: 'manual', status: 'accepted', photos: [] }, row)); return { id: nid }; },

/* ---------- flow ---------- */
const flash = (kind, text) => { S.msg = { kind, text }; };
async function enter() {                 // after a session exists: profile -> gates -> data
  await api.loadProfile();
  if (!S.profile) {
    let pend = null; try { pend = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null'); } catch (_) {}
    S.form = pend || {}; S.view = 'onboard'; return;
  }
  try { localStorage.removeItem(PENDING_KEY); } catch (_) {}
  if (!MGMT_ROLES.includes(role())) { S.blockText = 'Work orders are visible to owners, managers and project managers. Ask your company owner for access.'; S.view = 'blocked'; return; }
  await api.loadData(); S.view = 'app';
}
async function run(fn, okText) {         // one place for busy state + error display
  if (S.busy) return; S.busy = true; S.msg = null; render();
  try { await fn(); if (okText) flash('good', okText); }
  catch (e) { if (e.code === 'not_authenticated') { api.signOut(); S.view = 'auth'; } flash('err', errText(e)); }
  S.busy = false; render();
}
const fields = form => Object.fromEntries([...new FormData(form)].filter(([, v]) => typeof v === 'string').map(([k, v]) => [k, v.trim()]));

document.addEventListener('submit', ev => {
  const form = ev.target.closest('[data-form]'); if (!form) return; ev.preventDefault();
  const f = fields(form), kind = form.dataset.form, id = S.detailId;
  if (kind === 'signin') run(async () => { await api.signIn(f.email, f.password); await enter(); });
  else if (kind === 'signup') run(async () => {
    try { localStorage.setItem(PENDING_KEY, JSON.stringify({ company: f.company, display: f.display })); } catch (_) {}
    const signedIn = await api.signUp(f.email, f.password);
    if (!signedIn) { S.authMode = 'signin'; flash('note', 'Check your email to confirm your address, then sign in to finish setting up your company.'); return; }
    await api.createCompany(f.company, f.display); await enter();
  });
  else if (kind === 'company') { S.form = f; run(async () => { await api.createCompany(f.company, f.display); await enter(); }); }
  else if (kind === 'contractor') run(async () => { await api.saveContractor(S.edit.id, f); await api.loadData(); if (!S.edit.id) S.edit = null; }, 'Contractor saved.');
  else if (kind === 'order') run(async () => {
    const c = parseMoney(f.pay, true); if (c == null) throw appErr('amount_invalid');
    const r = await api.saveOrder(S.edit.id, { contractor_id: f.contractor_id, title: f.title, address: f.address, scope: f.scope, line_items: parseItems(f.items), payCents: c, scheduled_date: f.scheduled_date });
    await api.loadData(); S.detailId = S.edit.id || (r && r.id) || null; S.edit = null;
  }, 'Work order saved.');
  else if (kind === 'decline') run(async () => { await api.respond(id, false, f.reason); S.form = null; await api.loadData(); }, 'Declined. The contractor will see your response.');
  else if (kind === 'complete') { const files = [...form.querySelector('[name=photos]').files]; run(async () => { if (!files.length) throw appErr('photo_required'); await api.complete(id, files, f.notes); await api.loadData(); }, 'Marked complete.'); }
  else if (kind === 'pay') run(async () => { const c = parseMoney(f.amount); if (c == null) throw appErr('amount_required', 'Enter a dollar amount like 1250 or 1250.00.'); await api.submitPay(id, c, f.notes); await api.loadData(); }, 'Pay request saved.');
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'authmode') { S.authMode = S.authMode === 'signup' ? 'signin' : 'signup'; S.msg = null; }
  else if (a === 'tab') { S.tab = id; S.detailId = null; S.edit = null; S.msg = null; S.form = null; }
  else if (a === 'filter') S.filter = id;
  else if (a === 'open') { S.detailId = id; S.msg = null; S.form = null; window.scrollTo(0, 0); }
  else if (a === 'back') { if (S.edit && S.edit.kind === 'order' && S.edit.id) S.edit = null; else { S.edit = null; S.detailId = null; } S.msg = null; S.form = null; }
  else if (a === 'neworder') { S.edit = { kind: 'order', id: null }; S.msg = null; }
  else if (a === 'editorder') { S.edit = { kind: 'order', id: S.detailId }; S.msg = null; }
  else if (a === 'newcontractor') { S.edit = { kind: 'contractor', id: null }; S.msg = null; }
  else if (a === 'opencontractor') { S.edit = { kind: 'contractor', id }; S.msg = null; window.scrollTo(0, 0); }
  else if (a === 'decline') S.form = { declining: true };
  else if (a === 'canceldecline') S.form = null;
  else if (a === 'accept') return run(async () => { await api.respond(S.detailId, true, null); await api.loadData(); }, 'Accepted. It is on your schedule.');
  else if (a === 'cancelorder') return run(async () => { await api.cancelOrder(S.detailId); await api.loadData(); }, 'Job cancelled.');
  else if (a === 'markpay') return run(async () => { await api.markPay(S.detailId, id); await api.loadData(); }, id === 'paid' ? 'Marked paid.' : 'Marked approved.');
  else if (a === 'linkcode') return run(async () => { await api.createLinkCode(S.edit.id); await api.loadData(); }, 'Link code created.');
  else if (a === 'unlink') return run(async () => { await api.revokeLink(S.edit.id); await api.loadData(); }, 'Unlinked. The old code or connection no longer works.');
  else if (a === 'reload') return run(() => api.loadData());
  else if (a === 'signout') { api.signOut(); S.view = 'auth'; S.authMode = 'signin'; S.detailId = null; S.edit = null; S.msg = null; S.profile = null; }
  render();
});

(async function boot() {
  document.title = APP_NAME;
  render();
  if (!DEMO) { const s = loadSession(); if (s && s.access_token) { S.session = s; try { await enter(); render(); return; } catch (e) { if (e.code === 'not_authenticated') saveSession(null); else { S.view = 'auth'; flash('err', errText(e)); render(); return; } } } }
  S.view = 'auth'; render();
})();
</script>
</body>
