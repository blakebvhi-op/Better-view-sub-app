<style>

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Subcontractor app — standalone product, single file, no build step.
   Backend: its OWN Supabase project (schema: sub-app-standalone-MIGRATION.sql).
   Talks to Supabase with plain fetch (no SDK).

   A sub can use it alone (enter contractors and work orders by hand) or
   link a contractor: the sub creates a link code, the contractor enters it
   in their system (e.g. Better View Pro), and work orders arrive on their own.

   Add ?demo=1 to the URL to open DEMO MODE (fake in-memory data, nothing saved).
   ===================================================================== */
const APP_NAME = 'Sub Portal';           // working title — product name not chosen yet
const SB_URL   = 'https://uirtgwirsaddtolzahjx.supabase.co';
const SB_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpcnRnd2lyc2FkZHRvbHphaGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MzY5MDcsImV4cCI6MjExMTIxMjkwN30.JaLclDcIKkuzdtSpI8sBRmnx5nSbP_tuem2lUfj8XH4'; // anon (public) key
const PHOTO_BUCKET = 'wo-photos';
const MGMT_ROLES = ['owner', 'manager', 'project_manager'];
const BILLING_ROLES = ['owner', 'manager'];
const ROLE_LABEL = { owner: 'Owner', manager: 'Manager', project_manager: 'Project manager', laborer: 'Crew' };
const SESSION_KEY = 'subapp_session_v1';
const PENDING_KEY = 'subapp_pending_v2';
const CONTRACTOR_COLS = 'id,company_id,name,contact_name,phone,email,address,notes,link_status,link_code,link_code_expires,linked_name,linked_at';
const DEMO = !SB_URL || !SB_KEY || /[?&]demo=1\b/.test(location.search);
const SITE_URL = location.origin + location.pathname;

const NOW = new Date();
const S = { view: 'loading', authMode: 'signin', tab: 'contractors', stack: [], draft: null, cview: 'jobs', saved: [],
  filter: 'open', search: '', detailId: null, edit: null,
  cal: { y: NOW.getFullYear(), m: NOW.getMonth() }, calDay: null,
  session: null, profile: null, company: null, orders: [], pays: [], contractors: [], team: [], invites: [],
  msg: null, busy: false, form: null };

/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cents = v => { const n = Math.round(Number(v) * 100); return Number.isFinite(n) ? n : 0; };
const money = c => (c / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
function parseMoney(str, allowZero) {   // deterministic: digits, optional 1-2 decimals
  const t = String(str || '').replace(/[$,\s]/g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return null;
  const [d, f = ''] = t.split('.');
  const c = parseInt(d, 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
  return c > 0 || allowZero ? c : null;
}
const ymd = (y, m, d) => y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d.getFullYear(), d.getMonth(), d.getDate()); };
function fmtDate(d) {
  if (!d) return 'No date set';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d); if (!m) return String(d);
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
// ---- line items and money. All money math is integer cents; quantities are integer thousandths. ----
function parseQty(str) {                 // up to 3 decimals; returns thousandths or null
  const t = String(str == null ? '' : str).replace(/[,\s]/g, '');
  if (!/^\d+(\.\d{1,3})?$/.test(t)) return null;
  const [d, f = ''] = t.split('.');
  return parseInt(d, 10) * 1000 + parseInt((f + '000').slice(0, 3), 10);
}
const lineCents = l => { const r = parseMoney(l.rate, true), q = parseQty(l.qty); return r == null || q == null ? 0 : Math.floor((r * q + 500) / 1000); };
const linesTotal = lines => (lines || []).reduce((t, l) => t + (String(l.desc || '').trim() ? lineCents(l) : 0), 0);
const qtyText = l => (l.qty == null || l.qty === '' ? '' : String(l.qty)) + (l.unit ? ' ' + l.unit : '');
const blankLine = () => ({ desc: '', detail: '', qty: '', unit: '', rate: '' });
const cleanLines = (lines, withRate) => (lines || []).filter(l => String(l.desc || '').trim()).map(l => {
  const o = { desc: String(l.desc).trim(), detail: String(l.detail || '').trim(), unit: String(l.unit || '').trim(), qty: parseQty(l.qty) == null ? (withRate ? '0' : null) : String(l.qty).replace(/[,\s]/g, '') };
  if (!withRate && o.qty != null) o.qty = Number(o.qty);
  if (withRate) o.rate = parseMoney(l.rate, true) == null ? '0' : (parseMoney(l.rate, true) / 100).toFixed(2);
  return o;
});
// price list for a contractor: their own items first, then items saved for everyone
const priceList = cid => S.saved.filter(i => i.contractor_id === cid).concat(S.saved.filter(i => !i.contractor_id));
const priceFor = (cid, title) => { const t = String(title || '').trim().toLowerCase(); return t ? priceList(cid).find(i => i.title.trim().toLowerCase() === t) || null : null; };
function nextInvoiceNumber() {           // last number used, plus one
  const nums = S.pays.map(p => p.invoice_number).filter(Boolean);
  if (!nums.length) return 'INV-1001';
  const last = nums.sort((a, b) => String(a).localeCompare(String(b), 'en', { numeric: true })).pop(), m = /^(.*?)(\d+)$/.exec(last);
  return m ? m[1] + String(parseInt(m[2], 10) + 1).padStart(m[2].length, '0') : last + '-2';
}
const ORDER_LABEL = { sent: 'Needs response', accepted: 'Scheduled', declined: 'Declined', complete: 'Complete', cancelled: 'Cancelled' };
const PAY_LABEL = { submitted: 'Sent', approved: 'Approved', paid: 'Paid', rejected: 'Rejected' };
const LINK_LABEL = { manual: 'Not linked', pending: 'Code waiting', active: 'Linked', revoked: 'Unlinked' };
const ERR = {
  not_authenticated: 'Your session expired. Sign in again.',
  not_allowed: 'Your role does not allow this. Ask the company owner.',
  already_has_company: 'This login already belongs to a company.',
  company_name_required: 'Enter your company name.',
  display_name_required: 'Enter your name.',
  invalid_team_code: 'That join code was not found, was already used, or has expired.',
  role_invalid: 'Pick a role.',
  cannot_change_self: 'You cannot change your own role or remove yourself.',
  name_required: 'Enter the contractor name.',
  title_required: 'Enter a title for the work order.',
  amount_invalid: 'Enter a pay amount like 1250 or 1250.00.',
  contractor_not_found: 'That contractor was not found.',
  not_found: 'That record was not found.',
  not_found_or_locked: 'This work order can no longer be changed.',
  already_linked: 'This contractor is already linked. Unlink first to make a new code.',
  not_found_or_already_answered: 'This work order was already answered or is no longer available.',
  photo_required: 'Add at least one completion photo.',
  not_found_or_not_accepted: 'This work order must be accepted before it can be completed.',
  amount_required: 'The invoice total must be more than zero. Add a rate and quantity to at least one line.',
  work_order_not_complete: 'Mark the work order complete before billing.',
  already_submitted: 'An invoice was already sent for this work order.',
  not_found_or_linked: 'Payment status on a linked work order is set by the contractor.',
  '42501': 'Permission denied. Sign out and back in, then try again.',
  PGRST202: 'The database is not set up yet. Run the latest setup SQL, then try again.',
  PGRST205: 'The database is not set up yet. Run the latest setup SQL, then try again.',
  '42P01': 'The database is not set up yet. Run the latest setup SQL, then try again.'
};
const errText = e => ERR[e && e.code] || (e && e.message) || 'Something went wrong. Try again.';
function appErr(code, message) { const e = new Error(message || code); e.code = code; return e; }

/* ---------- Supabase REST (no SDK) ---------- */
function saveSession(s) { S.session = s; try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch (_) {} }
function loadSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (_) { return null; } }
function getPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || 'null'); } catch (_) { return null; } }
function setPending(p) { try { p ? localStorage.setItem(PENDING_KEY, JSON.stringify(p)) : localStorage.removeItem(PENDING_KEY); } catch (_) {} }
function toSession(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (Number(j.expires_in) || 3600), user: { id: j.user.id, email: j.user.email } }; }
async function authCall(path, body) {
  const r = await fetch(SB_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw appErr('auth', j.error_description || j.msg || j.message || 'That did not work. Check your details and try again.');
  return j;
}
async function refreshSession() {
  if (!S.session || !S.session.refresh_token) throw appErr('not_authenticated');
  try { saveSession(toSession(await authCall('token?grant_type=refresh_token', { refresh_token: S.session.refresh_token }))); }
  catch (_) { saveSession(null); throw appErr('not_authenticated'); }
}
const sb = {
  async req(path, opt = {}, retried) {
    if (S.session && S.session.expires_at - 60 < Date.now() / 1000 && !retried) await refreshSession();
    const headers = Object.assign({ apikey: SB_KEY, Authorization: 'Bearer ' + (S.session ? S.session.access_token : SB_KEY) }, opt.headers || {});
    let body = opt.body;
    if (body !== undefined && !(body instanceof Blob)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
    const r = await fetch(SB_URL + path, { method: opt.method || 'GET', headers, body });
    if (r.status === 401 && !retried) { await refreshSession(); return sb.req(path, opt, true); }
    const text = await r.text(); let j = null; try { j = text ? JSON.parse(text) : null; } catch (_) {}
    if (!r.ok) throw appErr((j && j.code) || 'http_' + r.status, (j && (j.message || j.msg || j.error)) || ('Request failed (' + r.status + ').'));
    return j;
  },
  async rpc(name, args) {
    const j = await sb.req('/rest/v1/rpc/' + name, { method: 'POST', body: args || {} });
    if (j && j.error) throw appErr(j.error);
    return j;
  }
};
// a photo is {url} (sent by a linked contractor) or {path} (uploaded here)
function photoUrl(p) {
  const v = p.url || p.path || '';
  return /^(https:|data:|blob:)/.test(v) ? v : SB_URL + '/storage/v1/object/public/' + PHOTO_BUCKET + '/' + v.split('/').map(encodeURIComponent).join('/');
}

/* ---------- data layer (live) ---------- */
const live = {
  async signIn(email, password) { saveSession(toSession(await authCall('token?grant_type=password', { email, password }))); },
  async signUp(email, password) {
    const j = await authCall('signup?redirect_to=' + encodeURIComponent(SITE_URL), { email, password });
    if (j.access_token) { saveSession(toSession(j)); return true; }
    return false;                       // email confirmation is on: user confirms, the link brings them back signed in
  },
  recover: email => authCall('recover?redirect_to=' + encodeURIComponent(SITE_URL), { email }),
  setPassword: password => sb.req('/auth/v1/user', { method: 'PUT', body: { password } }),
  async sessionFromLink(p) {            // email confirmation and password reset links land here with tokens in the URL
    S.session = { access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_at: Math.floor(Date.now() / 1000) + (Number(p.get('expires_in')) || 3600), user: {} };
    const u = await sb.req('/auth/v1/user');
    S.session.user = { id: u.id, email: u.email }; saveSession(S.session);
  },
  async loadProfile() {
    const rows = await sb.req('/rest/v1/profiles?select=*&id=eq.' + encodeURIComponent(S.session.user.id));
    S.profile = rows && rows[0] || null; S.company = null;
    if (S.profile) { const c = await sb.req('/rest/v1/companies?select=*&id=eq.' + encodeURIComponent(S.profile.company_id)); S.company = c && c[0] || null; }
  },
  async loadData() {                    // RLS scopes every row to this company
    const team = sb.req('/rest/v1/profiles?select=id,role,display_name,email&order=display_name');
    if (!isMgmt()) {                    // crew: accepted and completed jobs only, no pay
      const [r, t] = await Promise.all([sb.rpc('crew_work_orders'), team]);
      S.orders = r.work_orders || []; S.pays = []; S.contractors = []; S.invites = []; S.saved = []; S.team = t || []; return;
    }
    const [o, p, c, t, i] = await Promise.all([
      sb.req('/rest/v1/work_orders?select=*'),
      sb.req('/rest/v1/pay_requests?select=*'),
      sb.req('/rest/v1/contractors?select=' + CONTRACTOR_COLS + '&order=name'),
      team,
      canBill() ? sb.req('/rest/v1/team_invites?select=id,role,code,expires_at&used_at=is.null&order=created_at.desc') : [],
      sb.req('/rest/v1/saved_items?select=*&order=title')
    ]).then(a => { S.saved = a[5] || []; return a; });
    S.orders = o || []; S.pays = p || []; S.contractors = c || []; S.team = t || [];
    S.invites = (i || []).filter(x => new Date(x.expires_at) > new Date());
  },
  createCompany: (name, display) => sb.rpc('signup_create_company', { p_company_name: name, p_display_name: display }),

function toJpeg(file) {                  // downscale to max 1600px, JPEG
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(appErr('photo', 'Could not read that photo.')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(appErr('photo', 'Could not read that photo. Try a JPG or PNG.')); };
    img.src = url;
  });
}

    act = '<div class="card noprint"><div class="title">Respond to this date</div><div class="mut">' + esc(fmtDate(o.scheduled_date)) + '</div>' +
      (S.form && S.form.declining ? '<form data-form="decline"><label for="rs">Reason (optional)</label><textarea id="rs" name="reason"></textarea><div class="two"><button type="button" class="btn ghost" data-act="canceldecline">Back</button><button class="btn bad"' + dis() + '>Confirm decline</button></div></form>'
        : '<div class="two"><button class="btn bad" data-act="decline"' + dis() + '>Decline</button><button class="btn ok" data-act="accept"' + dis() + '>Accept</button></div>') + '</div>';
  } else if (o.status === 'accepted') {
    act = '<form data-form="complete" class="card noprint"><div class="title">Mark complete</div><label for="cp">Completion photos (at least one required)</label><input id="cp" name="photos" type="file" accept="image/*" multiple required>' +
      '<label for="nt">Notes (optional)</label><textarea id="nt" name="notes"></textarea><button class="btn ok"' + dis() + '>' + (S.busy ? 'Working…' : 'Mark complete') + '</button></form>' +
      (mg && manual ? '<div class="two noprint" style="margin-bottom:12px"><button class="btn ghost" style="margin-top:0" data-act="editorder"' + dis() + '>Edit</button><button class="btn bad" style="margin-top:0" data-act="cancelorder"' + dis() + '>Cancel job</button></div>' : '');
  } else if (o.status === 'complete' && mg) {
    if (pr) act = '<div class="card noprint"><div class="row" style="align-items:center"><div><div class="title">Invoice ' + esc(pr.invoice_number || '') + '</div><div class="pay">' + money(cents(pr.amount)) + '</div></div>' + pill('s-' + pr.status, PAY_LABEL[pr.status] || pr.status) + '</div><button class="btn ghost" data-act="openinvoice" data-id="' + esc(o.id) + '">View invoice</button></div>';
    else if (canBill()) act = '<div class="card noprint"><div class="title">Ready to invoice</div><p class="mut" style="margin:4px 0 0">The invoice starts from this work order’s line items and your saved rates.</p><button class="btn" data-act="editinvoice">Create invoice</button></div>';
    else act = '<div class="msg note noprint">Only the owner or a manager can invoice.</div>';
  }
  return msgHtml() + (mg ? '<div class="card noprint"><div class="row" style="align-items:center"><div><span class="mut">Your pay</span><div class="pay">' + money(cents(o.pay_amount)) + '</div></div><button class="link" data-act="print">Print work order</button></div><div class="mut">Pay is not printed and crew never see it.</div></div>' : '') +
    act + workOrderDoc(o) +
    (ph.length ? '<h2 class="noprint">Job photos</h2><div class="card noprint">' + photoGrid(ph) + '</div>' : '') +
    (cph.length || o.completion_notes ? '<h2 class="noprint">Completion</h2><div class="card noprint">' + (cph.length ? photoGrid(cph) : '') + (o.completion_notes ? '<p class="pre" style="margin:10px 0 0">' + esc(o.completion_notes) + '</p>' : '') + '</div>' : '');
}
function render() {
  let h;
  if (S.view === 'loading') h = '<main><div class="empty">Loading…</div></main>';
  else if (S.view === 'auth') h = viewAuth();
  else if (S.view === 'onboard') h = viewOnboard();
  else {
    const tabs = TABS(); if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
    const e = S.edit, o = S.detailId ? S.orders.find(x => String(x.id) === String(S.detailId)) : null, sub = e || o;
    let title, body;
    if (e && e.kind === 'order') { title = e.id ? 'Edit work order' : 'New work order'; body = viewOrderForm(); }
    else if (e && e.kind === 'contractor') { title = e.id ? 'Contractor' : 'Add contractor'; body = viewContractor(); }
    else if (e && e.kind === 'saved') { title = e.id ? 'Saved item' : 'New saved item'; body = viewSavedForm(); }
    else if (e && e.kind === 'invoice' && o) { title = e.mode === 'edit' ? 'Invoice' : 'Invoice ' + ((payFor(o.id) || {}).invoice_number || ''); body = e.mode === 'edit' ? viewInvoiceEdit(o) : viewInvoice(o); }
    else if (o) { title = isMgmt() ? 'Work order' : 'Job'; body = viewDetail(o); }
    else { title = tabs.find(t => t[0] === S.tab)[2]; body = S.tab === 'orders' ? viewOrders() : S.tab === 'schedule' ? viewSchedule() : S.tab === 'billing' ? viewBilling() : S.tab === 'contractors' ? viewContractors() : viewAccount(); }
    h = demoBar() + '<header>' + (sub ? '<button data-act="back" aria-label="Back">‹ Back</button>' : '') + '<h1>' + esc(title) + '</h1>' + (sub ? '' : '<button data-act="reload" aria-label="Refresh">↻</button>') + '</header><main>' + body + '</main>' +
      '<nav aria-label="Sections"><div>' + tabs.map(t => '<button data-act="tab" data-id="' + t[0] + '" class="' + (!sub && S.tab === t[0] ? 'on' : '') + '"><b aria-hidden="true">' + t[1] + '</b>' + t[2] + '</button>').join('') + '</div></nav>';
  }
  $app.innerHTML = h;
}

/* ---------- flow ---------- */
const flash = (kind, text) => { S.msg = { kind, text }; };
// screens stack, so Back always returns to where you came from (a contractor card, the calendar, the invoice list)
function go(edit, detailId, replace) {
  if (!replace) S.stack.push({ edit: S.edit, detailId: S.detailId, draft: S.draft });
  S.edit = edit || null; S.detailId = detailId || null; S.msg = null; S.form = null; window.scrollTo(0, 0);
}
function back() { const p = S.stack.pop() || {}; S.edit = p.edit || null; S.detailId = p.detailId || null; S.draft = p.draft || null; S.msg = null; S.form = null; }
function orderDraft(o, cid, date) {
  return o ? { contractor_id: o.contractor_id || '', title: o.title || '', address: o.address || '', scheduled_date: o.scheduled_date || '', scope: o.scope || '', pay: (cents(o.pay_amount) / 100).toFixed(2),
      lines: (Array.isArray(o.line_items) && o.line_items.length ? o.line_items : [blankLine()]).map(l => ({ desc: l.desc || '', detail: l.detail || '', qty: l.qty == null ? '' : String(l.qty), unit: l.unit || '', rate: '' })) }
    : { contractor_id: cid || '', title: '', address: '', scheduled_date: date || '', scope: '', pay: '', lines: [blankLine()] };
}
function invoiceDraft(o) {
  const pr = payFor(o.id); let lines;
  if (pr && Array.isArray(pr.line_items) && pr.line_items.length) lines = pr.line_items.map(l => ({ desc: l.desc || '', detail: l.detail || '', qty: String(l.qty == null ? '' : l.qty), unit: l.unit || '', rate: (cents(l.rate) / 100).toFixed(2) }));
  else lines = (Array.isArray(o.line_items) ? o.line_items : []).map(l => { const s = priceFor(o.contractor_id, l.desc); return { desc: l.desc || '', detail: l.detail || '', qty: l.qty == null ? '' : String(l.qty), unit: l.unit || (s && s.unit) || '', rate: s ? (cents(s.rate) / 100).toFixed(2) : '' }; });
  if (!lines.length) lines = [{ desc: o.title || '', detail: '', qty: '1', unit: '', rate: (cents(pr ? pr.amount : o.pay_amount) / 100).toFixed(2) }];
  return { number: (pr && pr.invoice_number) || nextInvoiceNumber(), date: (pr && pr.invoice_date) || day(0), due: (pr && pr.due_terms) || 'On receipt', po: (pr && pr.po) || o.address || '', notes: (pr && pr.notes) || '', lines, saveRates: false };
}
async function enter() {                 // after a session exists: profile -> company setup if needed -> data
  await api.loadProfile();
  if (!S.profile) {
    const pend = getPending(); setPending(null);
    if (pend && pend.display && (pend.mode === 'join' ? pend.code : pend.company)) {   // finish what sign-up started
      try { if (pend.mode === 'join') await api.joinTeam(pend.code, pend.display); else await api.createCompany(pend.company, pend.display); await api.loadProfile(); }
      catch (e) { S.form = pend; S.view = 'onboard'; flash('err', errText(e)); return; }
    }
    if (!S.profile) { S.form = pend || {}; S.view = 'onboard'; return; }
  }
  await api.loadData(); S.view = 'app'; S.tab = TABS()[0][0]; S.stack = []; S.edit = null; S.detailId = null;
}
async function run(fn, okText) {         // one place for busy state + error display
  if (S.busy) return; S.busy = true; S.msg = null; render();
  try { await fn(); if (okText) flash('good', okText); }
  catch (e) { if (e.code === 'not_authenticated') { api.signOut(); S.view = 'auth'; S.authMode = 'signin'; } flash('err', errText(e)); }
  S.busy = false; render();
}
const fields = form => Object.fromEntries([...new FormData(form)].filter(([, v]) => typeof v === 'string').map(([k, v]) => [k, v.trim()]));
async function signUpFlow(f, pend) {
  setPending(pend);
  const signedIn = await api.signUp(f.email, f.password);
  if (!signedIn) { S.authMode = 'checkemail'; S.form = { email: f.email }; return; }
  await enter();
}

document.addEventListener('submit', ev => {
  const form = ev.target.closest('[data-form]'); if (!form) return; ev.preventDefault();
  const f = fields(form), kind = form.dataset.form, id = S.detailId, d = S.draft;
  if (kind === 'signin') run(async () => { await api.signIn(f.email, f.password); await enter(); });
  else if (kind === 'signup') run(() => signUpFlow(f, { mode: 'new', company: f.company, display: f.display }));
  else if (kind === 'joinsignup') run(() => signUpFlow(f, { mode: 'join', code: f.code, display: f.display }));
  else if (kind === 'forgot') run(async () => { await api.recover(f.email); S.authMode = 'signin'; }, 'If that email has an account, a reset link is on its way.');
  else if (kind === 'newpw') run(async () => { await api.setPassword(f.password); await enter(); }, 'Password saved.');
  else if (kind === 'company') { S.form = Object.assign({}, S.form, f); run(async () => { await api.createCompany(f.company, f.display); await enter(); }); }
  else if (kind === 'join') { S.form = Object.assign({}, S.form, { code: f.code, display: f.display }); run(async () => { await api.joinTeam(f.code, f.display); await enter(); }); }
  else if (kind === 'account') run(async () => { await api.updateAccount(f); await api.loadProfile(); await api.loadData(); }, 'Saved.');
  else if (kind === 'invite') run(async () => { await api.createInvite(f.role); await api.loadData(); }, 'Join code created. Give it to your team member.');
  else if (kind === 'contractor') run(async () => {
    const isNew = !S.edit.id, r = await api.saveContractor(S.edit.id, f); await api.loadData();
    if (isNew) { const c = S.contractors.find(x => r && r.id ? x.id === r.id : x.name === f.name); if (c) { S.edit = { kind: 'contractor', id: c.id }; S.cview = 'jobs'; } else back(); }
  }, 'Contractor saved.');
  else if (kind === 'saved') run(async () => {
    const c = parseMoney(f.rate, true); if (c == null) throw appErr('amount_invalid', 'Enter a rate like 150 or 2.50.');
    await api.saveItem(S.edit.id, { contractor_id: f.all ? null : S.edit.cid, title: f.title, detail: f.detail, unit: f.unit, rateCents: c }); await api.loadData(); back();
  }, 'Saved to the price list.');
  else if (kind === 'order') run(async () => {
    const c = parseMoney(d.pay, true); if (c == null) throw appErr('amount_invalid');
    if (!d.contractor_id) throw appErr('contractor_not_found', 'Choose a contractor.');
    const r = await api.saveOrder(S.edit.id, { contractor_id: d.contractor_id, title: d.title.trim(), address: d.address.trim(), scope: d.scope.trim(), line_items: cleanLines(d.lines, false), payCents: c, scheduled_date: d.scheduled_date });
    await api.loadData(); const oid = S.edit.id || (r && r.id); S.draft = null;
    if (S.edit.id) back(); else go(null, oid, true);
  }, 'Work order saved.');
  else if (kind === 'invoice') run(async () => {
    if (!(linesTotal(d.lines) > 0)) throw appErr('amount_required');
    const o = S.orders.find(x => x.id === id);
    await api.submitInvoice(id, d);
    if (d.saveRates && o && o.contractor_id) for (const l of cleanLines(d.lines, true)) {
      const rc = parseMoney(l.rate, true); if (!rc) continue;
      const cur = S.saved.find(i => i.contractor_id === o.contractor_id && i.title.trim().toLowerCase() === l.desc.toLowerCase());
      await api.saveItem(cur ? cur.id : null, { contractor_id: o.contractor_id, title: l.desc, detail: cur ? cur.detail : '', unit: l.unit, rateCents: rc });
    }
    await api.loadData(); S.draft = null; S.edit = { kind: 'invoice', mode: 'view' };
  }, 'Invoice saved.');
  else if (kind === 'decline') run(async () => { await api.respond(id, false, f.reason); S.form = null; await api.loadData(); }, 'Declined. The contractor will see your response.');
  else if (kind === 'complete') { const files = [...form.querySelector('[name=photos]').files]; run(async () => { if (!files.length) throw appErr('photo_required'); await api.complete(id, files, f.notes); await api.loadData(); }, 'Marked complete.'); }
});
document.addEventListener('input', ev => {            // typing never redraws the screen; it only updates state and totals
  const t = ev.target;
  if (t.id === 'q') { S.search = t.value; const l = document.getElementById('olist'); if (l) l.innerHTML = orderListHtml(); return; }
  if (!S.draft || t.type === 'checkbox') return;
  if (t.dataset.d) S.draft[t.dataset.d] = t.value;
  else if (t.dataset.k) {
    const row = t.closest('[data-li]'); if (!row) return; const i = Number(row.dataset.li); S.draft.lines[i][t.dataset.k] = t.value;
    const a = document.getElementById('la-' + i); if (a) a.textContent = money(lineCents(S.draft.lines[i]));
    const tt = document.getElementById('invtotal'); if (tt) tt.textContent = money(linesTotal(S.draft.lines));
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (S.draft && t.dataset.d) {
    if (t.type === 'checkbox') { S.draft[t.dataset.d] = t.checked; return; }
    S.draft[t.dataset.d] = t.value; if (t.dataset.d === 'contractor_id') render(); return;
  }
  const el = t.closest('[data-change]'); if (!el) return;
  if (el.dataset.change === 'setrole') run(async () => { await api.setRole(el.dataset.id, el.value); await api.loadData(); }, 'Role updated.');
  else if (el.dataset.change === 'addsaved' && el.value && S.draft) {
    const i = S.saved.find(x => x.id === el.value); if (!i) return;
    const line = { desc: i.title, detail: i.detail || '', qty: '', unit: i.unit || '', rate: (cents(i.rate) / 100).toFixed(2) };
    const last = S.draft.lines[S.draft.lines.length - 1];
    if (last && !String(last.desc).trim() && !String(last.qty).trim()) S.draft.lines[S.draft.lines.length - 1] = line; else S.draft.lines.push(line);
    render(); const q = document.querySelector('[data-li="' + (S.draft.lines.length - 1) + '"] [data-k=qty]'); if (q) q.focus();
  }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, cur = S.detailId ? S.orders.find(x => x.id === S.detailId) : null;
  if (a === 'authmode') { S.authMode = id; S.msg = null; }
  else if (a === 'confirmcontinue') return run(() => enter());
  else if (a === 'tab') { S.tab = id; S.stack = []; S.detailId = null; S.edit = null; S.draft = null; S.msg = null; S.form = null; }
  else if (a === 'filter') S.filter = id;
  else if (a === 'cview') { S.cview = id; S.msg = null; }
  else if (a === 'open') go(null, id);
  else if (a === 'openinvoice') go({ kind: 'invoice', mode: 'view' }, id);
  else if (a === 'editinvoice') { if (cur) { go({ kind: 'invoice', mode: 'edit' }, cur.id, S.edit && S.edit.kind === 'invoice'); S.draft = invoiceDraft(cur); } }
  else if (a === 'back') back();
  else if (a === 'neworder') { go({ kind: 'order', id: null }); S.draft = orderDraft(null, b.dataset.cid, b.dataset.date); }
  else if (a === 'editorder') { if (cur) { go({ kind: 'order', id: cur.id }, cur.id); S.draft = orderDraft(cur); } }
  else if (a === 'newcontractor') go({ kind: 'contractor', id: null });
  else if (a === 'opencontractor') { go({ kind: 'contractor', id }); S.cview = 'jobs'; }
  else if (a === 'newsaved') go({ kind: 'saved', id: null, cid: S.edit.id });
  else if (a === 'opensaved') go({ kind: 'saved', id, cid: S.edit.id });
  else if (a === 'delsaved') return run(async () => { await api.deleteItem(S.edit.id); await api.loadData(); back(); }, 'Deleted from the price list.');
  else if (a === 'addline') S.draft.lines.push(blankLine());
  else if (a === 'rmline') { S.draft.lines.splice(Number(id), 1); if (!S.draft.lines.length) S.draft.lines.push(blankLine()); }
  else if (a === 'calcpay') {
    const ls = S.draft.lines.filter(l => String(l.desc).trim()); let n = 0, total = 0;
    ls.forEach(l => { const s = priceFor(S.draft.contractor_id, l.desc); if (s && parseQty(l.qty) != null) { n++; total += lineCents({ rate: (cents(s.rate) / 100).toFixed(2), qty: l.qty }); } });
    if (n) { S.draft.pay = (total / 100).toFixed(2); flash(n === ls.length ? 'good' : 'note', 'Priced ' + n + ' of ' + ls.length + ' lines from your price list: ' + money(total) + '.' + (n < ls.length ? ' The rest have no saved rate or no quantity.' : '')); }
    else flash('note', 'No lines match your price list yet. Lines need a quantity and the same item name as a saved item.');
  }
  else if (a === 'print') { window.print(); return; }
  else if (a === 'calnav') { const d = new Date(S.cal.y, S.cal.m + Number(id), 1); S.cal = { y: d.getFullYear(), m: d.getMonth() }; S.calDay = null; }
  else if (a === 'calday') S.calDay = S.calDay === id ? null : id;
  else if (a === 'decline') S.form = { declining: true };
  else if (a === 'canceldecline') S.form = null;
  else if (a === 'remove') S.form = { removing: id };
  else if (a === 'removeyes') return run(async () => { await api.removeMember(id); S.form = null; await api.loadData(); }, 'Removed from the team.');
  else if (a === 'cancelinvite') return run(async () => { await api.cancelInvite(id); await api.loadData(); }, 'Join code cancelled.');
  else if (a === 'accept') return run(async () => { await api.respond(S.detailId, true, null); await api.loadData(); }, 'Accepted. It is on your schedule.');
  else if (a === 'cancelorder') return run(async () => { await api.cancelOrder(S.detailId); await api.loadData(); }, 'Job cancelled.');
  else if (a === 'markpay') return run(async () => { await api.markPay(S.detailId, id); await api.loadData(); }, id === 'paid' ? 'Marked paid.' : 'Marked approved.');
  else if (a === 'linkcode') return run(async () => { await api.createLinkCode(S.edit.id); await api.loadData(); }, 'Link code created.');
  else if (a === 'unlink') return run(async () => { await api.revokeLink(S.edit.id); await api.loadData(); }, 'Unlinked. The old code or connection no longer works.');
  else if (a === 'reload') return run(() => api.loadData());
  else if (a === 'signout') { api.signOut(); Object.assign(S, { view: 'auth', authMode: 'signin', detailId: null, edit: null, draft: null, stack: [], msg: null, profile: null, search: '', filter: 'open', calDay: null, form: null }); }
  render();
});

(async function boot() {
  document.title = APP_NAME;
  render();
  if (!DEMO) {
    const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (hp.get('access_token') || hp.get('error_description')) {      // came back from an email link
      history.replaceState(null, '', location.pathname + location.search);
      if (hp.get('error_description')) { S.view = 'auth'; flash('err', hp.get('error_description') + '. Sign in, or ask for a new link.'); render(); return; }
      try {
        await api.sessionFromLink(hp);
        S.view = 'auth'; S.authMode = hp.get('type') === 'recovery' ? 'newpw' : 'confirmed'; render(); return;
      } catch (e) { saveSession(null); S.view = 'auth'; flash('err', errText(e)); render(); return; }
    }
    const s = loadSession();
    if (s && s.access_token) {
      S.session = s;
      try { await enter(); render(); return; }
      catch (e) { if (e.code === 'not_authenticated') saveSession(null); else { S.view = 'auth'; flash('err', errText(e)); render(); return; } }
    }
  } else if (/[?&]screen=confirmed\b/.test(location.search)) { S.session = { user: { id: 'demo', email: 'you@example.com' } }; S.view = 'auth'; S.authMode = 'confirmed'; render(); return; }
  S.view = 'auth'; render();
})();
</script>
