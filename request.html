<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16191d">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Send a job">
<!-- This page is its own small app: a contractor opens their link, sends jobs to one subcontractor, and can add it to their home screen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; manifest-src 'self' blob:; form-action 'none'; base-uri 'none'">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Send a job</title>
<style>
:root{--ink:#16191d;--ink2:#2c333b;--steel:#5d6975;--line:#e1e5ea;--mist:#eef1f4;--field:#f5f7f9;--paper:#fff;--chalk:#1f5ae0;--chalk-d:#1848b8;--chalk-soft:#e8effd;--ok:#19794d;--ok-soft:#e2f4ea;--warn:#8a5a0b;--warn-soft:#fbf0d9;--bad:#b8322a;--bad-soft:#fbe7e5;--disp:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--ink) repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 27px,rgba(255,255,255,.055) 27px 28px);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{color:#fff;padding:calc(26px + env(safe-area-inset-top)) 22px 22px}
.who{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:14px;background:#fff;object-fit:contain;flex:none}
.mono{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#fff;color:var(--ink);font:700 20px/1 var(--disp)}
.small{font-size:14px;color:#aeb7c1}
.top h1{font:700 30px/1.08 var(--disp);letter-spacing:-.01em;margin:2px 0 0}
.as{margin-top:12px;font-size:14px;color:#c3cad3}
.sheet{flex:1;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 20px calc(36px + env(safe-area-inset-bottom))}
.seg{display:flex;gap:2px;background:#e0e4e9;border-radius:13px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-size:14px;font-weight:550;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(22,25,29,.12)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--field)}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--chalk);background:var(--paper);box-shadow:0 0 0 3px var(--chalk-soft)}
button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
::placeholder{color:#8c96a1}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;margin-top:14px;font-weight:650;font-size:16px;cursor:pointer;background:var(--chalk);color:#fff}
.btn.ghost{background:var(--chalk-soft);color:var(--chalk-d)}
.btn[disabled]{opacity:.55}
.link{background:none;border:0;padding:8px 0;color:var(--chalk);font-size:15px;font-weight:550;cursor:pointer}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
h2{font:600 18px/1.2 var(--disp);margin:22px 0 2px}
.mut{color:var(--steel);font-size:14px}
.li{border-radius:14px;padding:12px;margin-top:10px;background:var(--mist)}
.li input,.li textarea{background:var(--paper)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.msg{border-radius:12px;padding:12px 14px;margin:8px 0 4px;font-size:15px;font-weight:500}
.msg.err{background:var(--bad-soft);color:#7d1f19}.msg.good{background:var(--ok-soft);color:#0f5132}
.card{border-radius:16px;padding:14px 15px;margin-top:10px;background:var(--paper);box-shadow:0 0 0 1px rgba(22,25,29,.07),0 1px 2px rgba(22,25,29,.05)}
.title{font-weight:650}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;padding:6px 9px;border-radius:8px;white-space:nowrap;background:var(--mist);color:var(--ink2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-sent{background:var(--warn-soft);color:var(--warn)}.s-accepted{background:var(--chalk-soft);color:var(--chalk-d)}.s-complete{background:var(--ok-soft);color:var(--ok)}.s-declined,.s-cancelled{background:var(--bad-soft);color:var(--bad)}
.backb{background:none;border:0;color:#c3cad3;font-size:14px;font-weight:550;padding:0 0 14px;cursor:pointer}
.top .as{margin-top:8px}
.logo.sm,.mono.sm{width:44px;height:44px;border-radius:13px}
.mono.sm{background:var(--ink);color:#fff;font-size:17px}
button.card{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;text-align:left;cursor:pointer}
.go{font-size:26px;color:var(--steel);line-height:1}
.center{text-align:center}
.big{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:36px;line-height:68px;margin:18px auto 10px}
.foot{margin-top:26px;font-size:13px;color:var(--steel)}
.foot a{color:var(--steel)}
</style>
</head>
<body>
<div class="wrap" id="r"></div>
<script>
'use strict';
/* Subbit job request app, for contractors. No login.
   A contractor makes a profile once on this device. Each subcontractor they work with is a card, added by opening that sub's link:
     ?c=<invite token>   the sub's "add yourself" link: the profile creates the contractor's card in the sub's account
     ?t=<token>[,<token>] the contractor's own job request link(s) */
const SB_URL = 'https://uirtgwirsaddtolzahjx.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpcnRnd2lyc2FkZHRvbHphaGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MzY5MDcsImV4cCI6MjExMTIxMjkwN30.JaLclDcIKkuzdtSpI8sBRmnx5nSbP_tuem2lUfj8XH4';
const TOKENS_KEY = 'subbit_request_tokens', PROFILE_KEY = 'subbit_request_profile';
const $r = document.getElementById('r');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
const qs = new URLSearchParams(location.search);
const urlTokens = (qs.get('t') || '').split(',').map(x => x.trim()).filter(Boolean);
let inviteToken = (qs.get('c') || '').trim();
const DEMO = urlTokens[0] === 'demo' || inviteToken === 'demo';
let tokens = DEMO ? (inviteToken ? [] : ['demo']) : [...new Set([...urlTokens, ...((store.get(TOKENS_KEY) || []).filter(x => typeof x === 'string'))])];
let profile = DEMO ? null : store.get(PROFILE_KEY);
const blank = () => ({ desc: '', detail: '', qty: '', unit: '' });
const fresh = () => ({ title: '', address: '', date: '', scope: '', pay: '', lines: [blank()] });
const R = { view: 'loading', tab: 'new', subs: [], cur: null, inviter: null, draft: fresh(), pdraft: null, busy: false, msg: null, canInstall: null };
const ERR = {
  invalid_request_link: 'This link is no longer active. Ask your subcontractor for a new one.',
  title_required: 'Give the job a title.',
  requester_required: 'Enter your name.',
  company_name_required: 'Enter your company name.',
  amount_invalid: 'Enter the pay as a number, like 1800 or 1800.00.',
  too_long: 'That is too much text for one job. Shorten the notes or split it into two jobs.',
  too_many_waiting: 'Too many are waiting right now. Give your subcontractor a chance to respond, then try again.'
};
const STATUS = { sent: 'Waiting for answer', accepted: 'Accepted', declined: 'Declined', complete: 'Complete', cancelled: 'Cancelled' };
function fmtDate(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); if (!m) return 'No date set';
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
function parseMoney(str) { const t = String(str || '').replace(/[$,\s]/g, ''); if (!t) return 0; return /^\d+(\.\d{1,2})?$/.test(t) ? Number(t) : null; }
function fail(code) { const e = new Error(ERR[code] || 'Something went wrong. Try again.'); e.code = code; throw e; }
function syncUrl() {                      // the address always carries every link, so "Add to Home Screen" keeps them all
  if (DEMO) return;
  store.set(TOKENS_KEY, tokens);
  history.replaceState(null, '', location.pathname + (tokens.length ? '?t=' + tokens.map(encodeURIComponent).join(',') : ''));
}

/* ---- server ---- */
const demoJobs = [{ title: 'Soffit and fascia, front elevation', address: '12 Test Ct, Anytown, WI', scheduled_date: null, status: 'accepted', decline_reason: null }];
async function rpc(name, args) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 100));
    if (name === 'request_invite_peek') return { ok: true, sub_company_name: 'Demo Subcontracting LLC', sub_logo_path: null };
    if (name === 'request_join') return { ok: true, token: 'demo' };
    if (name === 'request_peek') return { ok: true, sub_company_name: 'Demo Subcontracting LLC', sub_logo_path: null, contractor_name: (profile && profile.company) || 'Example Builders', contact_name: null };
    if (name === 'request_profile_save') return { ok: true };
    if (name === 'request_list') return { ok: true, jobs: demoJobs.slice() };
    if (!String(args.p_title || '').trim()) return fail('title_required');
    demoJobs.unshift({ title: args.p_title, address: args.p_address, scheduled_date: args.p_scheduled_date, status: 'sent', decline_reason: null });
    return { ok: true };
  }
  const res = await fetch(SB_URL + '/rest/v1/rpc/' + name, { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  const j = await res.json().catch(() => null);
  if (!res.ok) throw new Error(res.status === 404 ? 'Job requests are not turned on yet. Tell your subcontractor.' : 'Could not reach the server. Check your connection and try again.');
  if (j && j.error) return fail(j.error);
  return j;
}
const pushProfile = t => rpc('request_profile_save', { p_token: t, p_contact: profile.name, p_phone: profile.phone || '', p_email: profile.email || '', p_address: profile.address || '' });
async function loadSub(t) {               // one subcontractor card: who they are and where my jobs stand
  const info = await rpc('request_peek', { p_token: t });
  let jobs = []; try { jobs = (await rpc('request_list', { p_token: t })).jobs || []; } catch (_) {}
  return { t, info, jobs };
}
async function loadAll() {
  const out = await Promise.all(tokens.map(t => loadSub(t).catch(e => ({ t, dead: e.code === 'invalid_request_link', error: e.message }))));
  const dead = out.filter(x => x.dead).map(x => x.t);
  if (dead.length) { tokens = tokens.filter(t => !dead.includes(t)); syncUrl(); }
  R.subs = out.filter(x => x.info).sort((a, b) => a.info.sub_company_name.localeCompare(b.info.sub_company_name));
  return { dead: dead.length, failed: out.filter(x => !x.info && !x.dead).length };
}

/* ---- home screen app ---- */
function setManifest() {
  try {
    document.querySelectorAll('link[rel=manifest]').forEach(l => l.remove());
    const here = location.href.split('#')[0], base = new URL('.', here).href, one = R.subs.length === 1 ? R.subs[0].info.sub_company_name : '';
    const name = one ? 'Jobs for ' + one : 'My subcontractors';
    const m = { name, short_name: one && one.length <= 12 ? one : 'Send a job', id: here, start_url: here, scope: base, display: 'standalone', background_color: '#16191d', theme_color: '#16191d',
      icons: [{ src: base + 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.appendChild(l);
    const t = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (t) t.content = (one || 'Send a job').slice(0, 14);
    document.title = one ? 'Send a job to ' + one : 'Send a job';
  } catch (_) {}
}
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); R.canInstall = ev; render(); });
const standalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

/* ---- views ---- */
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const logoUrl = p => p ? SB_URL + '/storage/v1/object/public/wo-photos/' + p.split('/').map(encodeURIComponent).join('/') : '';
const badge = (info, cls) => info.sub_logo_path ? '<img class="logo ' + (cls || '') + '" src="' + esc(logoUrl(info.sub_logo_path)) + '" alt="">' : '<div class="mono ' + (cls || '') + '" aria-hidden="true">' + esc(initials(info.sub_company_name)) + '</div>';
const msgHtml = () => R.msg ? '<div class="msg ' + R.msg.kind + '" role="status">' + esc(R.msg.text) + '</div>' : '';
const f = (id, key, label, extra) => '<label for="' + id + '">' + label + '</label><input id="' + id + '" data-d="' + key + '" value="' + esc(R.draft[key]) + '" ' + (extra || '') + '>';
const pf = (id, key, label, extra) => '<label for="' + id + '">' + label + '</label><input id="' + id + '" data-p="' + key + '" value="' + esc(R.pdraft[key]) + '" ' + (extra || '') + '>';
const foot = () => '<div class="foot">' + (standalone() ? '' : R.canInstall ? '<button class="link" data-act="install">Add this to your home screen</button>' : '<div>Tip: add this page to your home screen to send jobs with one tap.</div>') + '<div style="margin-top:8px">Powered by <a href="./">Subbit</a></div></div>';
const plainTop = (t, sub) => '<div class="top"><h1>' + esc(t) + '</h1>' + (sub ? '<div class="as">' + esc(sub) + '</div>' : '') + '</div>';

function profileView() {
  const first = !profile, inv = R.inviter;
  return plainTop(first ? 'Set up your profile' : 'Your profile', first ? (inv ? inv.sub_company_name + ' invited you to send them jobs. Tell them who you are.' : 'Tell your subcontractors who you are. You only do this once.') : 'Your subcontractors see these details on your card.') +
    '<div class="sheet">' + msgHtml() + '<form data-form="profile">' + pf('pc', 'company', 'Your company name', 'required autocomplete="organization"') + pf('pn', 'name', 'Your name', 'required autocomplete="name"') +
    pf('pp', 'phone', 'Phone', 'type="tel" autocomplete="tel"') + pf('pe', 'email', 'Email', 'type="email" autocomplete="email"') + pf('pa', 'address', 'Billing address', 'autocomplete="street-address"') +
    '<button class="btn"' + (R.busy ? ' disabled' : '') + '>' + (R.busy ? 'Saving…' : first ? 'Save and continue' : 'Save profile') + '</button></form>' +
    (first ? '' : '<button class="btn ghost" data-act="home">Cancel</button>') + '</div>';
}
function homeView() {
  const cards = R.subs.map(s => { const w = s.jobs.filter(j => j.status === 'sent').length, a = s.jobs.filter(j => j.status === 'accepted').length;
    return '<button class="card sub" data-act="open" data-id="' + esc(s.t) + '"><div class="who">' + badge(s.info, 'sm') + '<div><div class="title">' + esc(s.info.sub_company_name) + '</div><div class="mut">' + (s.jobs.length ? w + ' waiting, ' + a + ' accepted' : 'No jobs sent yet') + '</div></div></div><span class="go" aria-hidden="true">›</span></button>'; }).join('');
  return plainTop('Your subcontractors', profile.company) + '<div class="sheet">' + msgHtml() +
    (cards || '<p class="mut center" style="padding:26px 10px">No subcontractors here yet. Open the link a subcontractor sent you and they will be added.</p>') +
    '<p class="mut" style="margin-top:18px">To add another subcontractor, open the link they send you on this device.</p>' +
    '<button class="btn ghost" data-act="editprofile">Edit your profile</button>' + foot() + '</div>';
}
function formView() {
  const d = R.draft;
  return '<form data-form="job">' + f('jt', 'title', 'Job title', 'required placeholder="e.g. Tear off and re-roof garage"') + f('ja', 'address', 'Job address', 'autocomplete="off"') + f('jd', 'date', 'Date you need it', 'type="date"') +
    '<h2>Line items</h2><div class="mut">Optional. What needs doing and how much of it.</div>' +
    d.lines.map((l, i) => '<div class="li" data-li="' + i + '"><input data-k="desc" value="' + esc(l.desc) + '" placeholder="Item, e.g. Vinyl siding" aria-label="Line ' + (i + 1) + ' item">' +
      '<textarea data-k="detail" placeholder="Details, one per line (optional)" aria-label="Line ' + (i + 1) + ' details" style="min-height:50px;margin-top:8px">' + esc(l.detail) + '</textarea>' +
      '<div class="two" style="margin-top:8px"><input data-k="qty" value="' + esc(l.qty) + '" inputmode="decimal" placeholder="Qty" aria-label="Line ' + (i + 1) + ' quantity"><input data-k="unit" value="' + esc(l.unit) + '" placeholder="Unit (sq, lf, ea)" aria-label="Line ' + (i + 1) + ' unit"></div>' +
      (d.lines.length > 1 ? '<button type="button" class="link" data-act="rm" data-id="' + i + '">Remove</button>' : '') + '</div>').join('') +
    '<button type="button" class="btn ghost" data-act="add">+ Add another line</button>' +
    '<label for="js">Scope and notes</label><textarea id="js" data-d="scope" placeholder="Access, materials on site, anything they should know">' + esc(d.scope) + '</textarea>' +
    f('jp', 'pay', 'What you will pay for this job (optional)', 'inputmode="decimal" placeholder="e.g. 1800"') +
    '<p class="mut" style="margin:14px 0 0">Sending as ' + esc(profile.name) + ', ' + esc(profile.company) + '.</p>' +
    '<button class="btn"' + (R.busy ? ' disabled' : '') + '>' + (R.busy ? 'Sending…' : 'Send job') + '</button></form>';
}
function listView(s) {
  if (!s.jobs.length) return '<p class="mut center" style="padding:30px 10px">Jobs you send show up here with their status.</p>';
  return s.jobs.map(j => '<div class="card"><div class="row"><div><div class="title">' + esc(j.title) + '</div><div class="mut">' + esc(j.address || '') + '</div><div class="mut">' + esc(fmtDate(j.scheduled_date)) + '</div></div><span class="pill s-' + esc(j.status) + '">' + esc(STATUS[j.status] || j.status) + '</span></div>' +
    (j.status === 'declined' && j.decline_reason ? '<div class="mut" style="margin-top:8px">Reason: ' + esc(j.decline_reason) + '</div>' : '') + '</div>').join('') +
    '<button class="btn ghost" data-act="refresh"' + (R.busy ? ' disabled' : '') + '>Refresh</button>';
}
function subView() {
  const s = R.subs.find(x => x.t === R.cur); if (!s) { R.view = 'home'; return homeView(); }
  let body;
  if (R.view === 'sent') body = '<div class="center"><div class="big" aria-hidden="true">✓</div><h2 style="font-size:24px;margin-top:0">Job sent</h2><p class="mut">' + esc(s.info.sub_company_name) + ' will accept or decline it. Check "Sent jobs" to see their answer.</p><button class="btn" data-act="again">Send another job</button><button class="btn ghost" data-act="tab" data-id="list">See sent jobs</button></div>';
  else body = '<div class="seg"><button data-act="tab" data-id="new" class="' + (R.tab === 'new' ? 'on' : '') + '" aria-pressed="' + (R.tab === 'new') + '">New job</button><button data-act="tab" data-id="list" class="' + (R.tab === 'list' ? 'on' : '') + '" aria-pressed="' + (R.tab === 'list') + '">Sent jobs (' + s.jobs.length + ')</button></div>' + msgHtml() + (R.tab === 'new' ? formView() : listView(s));
  return '<div class="top"><button class="backb" data-act="home">‹ All subcontractors</button><div class="who">' + badge(s.info) + '<div><div class="small">Send a job to</div><h1>' + esc(s.info.sub_company_name) + '</h1></div></div></div><div class="sheet">' + body + foot() + '</div>';
}
function render() {
  if (R.view === 'loading') $r.innerHTML = plainTop('Send a job');
  else if (R.view === 'bad') $r.innerHTML = plainTop('Send a job') + '<div class="sheet"><div class="msg err">' + esc(R.msg ? R.msg.text : ERR.invalid_request_link) + '</div></div>';
  else if (R.view === 'profile') $r.innerHTML = profileView();
  else if (R.view === 'home') $r.innerHTML = homeView();
  else $r.innerHTML = subView();
}

/* ---- events ---- */
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.p && R.pdraft) R.pdraft[t.dataset.p] = t.value;
  else if (t.dataset.d) R.draft[t.dataset.d] = t.value;
  else if (t.dataset.k) { const row = t.closest('[data-li]'); if (row) R.draft.lines[Number(row.dataset.li)][t.dataset.k] = t.value; }
});
async function refreshCur() { const i = R.subs.findIndex(x => x.t === R.cur); if (i < 0) return; try { R.subs[i].jobs = (await rpc('request_list', { p_token: R.cur })).jobs || []; } catch (_) {} }
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'add') R.draft.lines.push(blank());
  else if (a === 'rm') R.draft.lines.splice(Number(b.dataset.id), 1);
  else if (a === 'open') { R.cur = b.dataset.id; R.view = 'sub'; R.tab = 'new'; R.draft = fresh(); R.msg = null; window.scrollTo(0, 0); }
  else if (a === 'home') { R.view = 'home'; R.msg = null; R.pdraft = null; window.scrollTo(0, 0); }
  else if (a === 'editprofile') { R.pdraft = Object.assign({ company: '', name: '', phone: '', email: '', address: '' }, profile); R.view = 'profile'; R.msg = null; window.scrollTo(0, 0); }
  else if (a === 'again') { R.draft = fresh(); R.view = 'sub'; R.tab = 'new'; R.msg = null; window.scrollTo(0, 0); }
  else if (a === 'tab') { R.view = 'sub'; R.tab = b.dataset.id; R.msg = null; if (R.tab === 'list') { render(); await refreshCur(); } }
  else if (a === 'refresh') { R.busy = true; render(); await refreshCur(); R.busy = false; }
  else if (a === 'install') { const p = R.canInstall; R.canInstall = null; if (p) p.prompt(); }
  render();
});
document.addEventListener('submit', async ev => {
  const form = ev.target.closest('[data-form]'); if (!form) return; ev.preventDefault();
  if (R.busy) return; R.msg = null;
  if (form.dataset.form === 'profile') {
    const p = {}; Object.keys(R.pdraft).forEach(k => { p[k] = String(R.pdraft[k] || '').trim(); });
    if (!p.company) { R.msg = { kind: 'err', text: ERR.company_name_required }; render(); return; }
    if (!p.name) { R.msg = { kind: 'err', text: ERR.requester_required }; render(); return; }
    const firstTime = !profile; R.busy = true; render();
    profile = p; if (!DEMO) store.set(PROFILE_KEY, profile);
    try {
      if (firstTime) await start();     // creates the card for an invite, then opens the app
      else { await Promise.all(tokens.map(t => pushProfile(t).catch(() => null))); R.view = 'home'; R.msg = { kind: 'good', text: 'Profile saved. Your subcontractors will see the new details.' }; }
    } catch (e) { R.msg = { kind: 'err', text: e.message }; if (firstTime && e.code !== 'invalid_request_link') { profile = null; if (!DEMO) store.set(PROFILE_KEY, null); } }
    R.busy = false; R.pdraft = R.view === 'profile' ? R.pdraft : null; render(); return;
  }
  const d = R.draft, pay = parseMoney(d.pay);
  if (pay === null) { R.msg = { kind: 'err', text: ERR.amount_invalid }; render(); return; }
  const lines = d.lines.filter(l => l.desc.trim()).map(l => ({ desc: l.desc.trim(), detail: l.detail.trim(), qty: /^\d+(\.\d+)?$/.test(l.qty.trim()) ? Number(l.qty.trim()) : null, unit: l.unit.trim() }));
  R.busy = true; render();
  try {
    await rpc('request_submit', { p_token: R.cur, p_title: d.title.trim(), p_address: d.address.trim(), p_scope: d.scope.trim(), p_line_items: lines, p_scheduled_date: d.date || null, p_offered_pay: pay || null,
      p_requested_by: profile.name + (profile.phone || profile.email ? ', ' + (profile.phone || profile.email) : '') });
    R.view = 'sent'; window.scrollTo(0, 0); refreshCur().then(render);
  } catch (e) { R.msg = { kind: 'err', text: e.message }; if (e.code === 'invalid_request_link') { await loadAll(); R.view = 'home'; } }
  R.busy = false; render();
});

/* ---- start-up ---- */
async function start() {                  // runs once a profile exists
  let opened = urlTokens.find(t => tokens.includes(t)) || null;
  if (inviteToken) {                      // the profile creates this contractor's card in the sub's account
    const r = await rpc('request_join', { p_ctoken: inviteToken, p_company: profile.company, p_contact: profile.name, p_phone: profile.phone || '', p_email: profile.email || '', p_address: profile.address || '' });
    inviteToken = ''; if (!tokens.includes(r.token)) tokens.push(r.token); opened = r.token;
  }
  syncUrl();
  const res = await loadAll();
  // a card the sub typed in by hand has no contact details yet: fill them from the profile, once
  await Promise.all(R.subs.filter(s => !s.info.contact_name).map(s => pushProfile(s.t).then(() => { s.info.contact_name = profile.name; }).catch(() => null)));
  setManifest();
  if (!R.subs.length && !tokens.length) { R.view = urlTokens.length ? 'bad' : 'home'; if (urlTokens.length) R.msg = { kind: 'err', text: ERR.invalid_request_link }; return; }
  if (res.dead && !R.msg) R.msg = { kind: 'err', text: 'A link you had is no longer active, so that subcontractor was removed from your list.' };
  if (res.failed && !R.msg) R.msg = { kind: 'err', text: 'Could not reach the server. Check your connection and reopen the app.' };
  const target = (opened && R.subs.find(s => s.t === opened)) || (R.subs.length === 1 ? R.subs[0] : null);
  if (target) { R.cur = target.t; R.view = 'sub'; R.tab = 'new'; } else R.view = 'home';
}
(async function boot() {
  render();
  if (!tokens.length && !inviteToken && !profile) { R.view = 'bad'; R.msg = { kind: 'err', text: 'This page needs the link your subcontractor sent you. Open that link again.' }; render(); return; }
  try {
    if (!profile) {
      if (inviteToken) R.inviter = await rpc('request_invite_peek', { p_ctoken: inviteToken });
      else if (tokens.length) {           // new device: the details on my card are my profile
        const info = await rpc('request_peek', { p_token: tokens[0] }).catch(e => { if (e.code === 'invalid_request_link') throw e; return null; });
        if (info) { R.inviter = info; if (info.contact_name && !DEMO) { profile = { company: info.contractor_name, name: info.contact_name, phone: info.phone || '', email: info.email || '', address: info.address || '' }; store.set(PROFILE_KEY, profile); } }
      }
    }
    if (!profile) { R.pdraft = { company: (R.inviter && R.inviter.contractor_name) || '', name: '', phone: '', email: '', address: '' }; R.view = 'profile'; render(); return; }
    await start();
  } catch (e) { R.view = 'bad'; R.msg = { kind: 'err', text: e.message }; }
  render();
})();
</script>
